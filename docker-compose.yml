services:
  postgres:
    image: postgres:15
    container_name: postgres-dataproject
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-dataproject
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: "5432"
    depends_on:
      - postgres

volumes:
  pgdata:

